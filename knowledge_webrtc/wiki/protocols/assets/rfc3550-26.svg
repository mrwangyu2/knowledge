<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="800" fill="#ffffff" rx="16"/>

  <!-- Title -->
  <text x="40" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">场景 A：视频会议中的异构接收方</text>

  <!-- Sender node -->
  <rect x="480" y="90" width="440" height="64" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="8" rx="12"/>
  <text x="700" y="130" font-size="26" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">发送方 (北京, 千兆光纤)</text>

  <!-- Tree branches from sender -->
  <line x1="700" y1="154" x2="700" y2="190" stroke="#1a3f8a" stroke-width="6"/>
  <line x1="240" y1="190" x2="1160" y2="190" stroke="#1a3f8a" stroke-width="6"/>
  <line x1="240" y1="190" x2="240" y2="220" stroke="#1a3f8a" stroke-width="6"/>
  <line x1="700" y1="190" x2="700" y2="220" stroke="#1a3f8a" stroke-width="6"/>
  <line x1="1160" y1="190" x2="1160" y2="220" stroke="#1a3f8a" stroke-width="6"/>

  <!-- Layer 0 -->
  <rect x="40" y="220" width="400" height="96" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="8"/>
  <text x="240" y="256" font-size="22" font-weight="bold" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">基础层 (Layer 0)</text>
  <text x="240" y="292" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">360p, 200kbps → 多播组 G0</text>

  <!-- Layer 1 -->
  <rect x="500" y="220" width="400" height="96" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="8"/>
  <text x="700" y="256" font-size="22" font-weight="bold" fill="#8b6508" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">增强层 1 (Layer 1)</text>
  <text x="700" y="292" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">720p 增量, 500kbps → 多播组 G1</text>

  <!-- Layer 2 -->
  <rect x="960" y="220" width="400" height="96" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="8"/>
  <text x="1160" y="256" font-size="22" font-weight="bold" fill="#0d6b2e" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">增强层 2 (Layer 2)</text>
  <text x="1160" y="292" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4K 增量, 3Mbps → 多播组 G2</text>

  <!-- Labels under layers -->
  <text x="240" y="350" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">最低保底质量</text>
  <text x="700" y="350" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">在基础层之上补充细节</text>
  <text x="1160" y="350" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">最高画质</text>

  <!-- Down arrows from layers to receivers box -->
  <line x1="240" y1="400" x2="240" y2="440" stroke="#1a3f8a" stroke-width="4" stroke-dasharray="6,6"/>
  <line x1="700" y1="400" x2="700" y2="440" stroke="#1a3f8a" stroke-width="4" stroke-dasharray="6,6"/>
  <line x1="1160" y1="400" x2="1160" y2="440" stroke="#1a3f8a" stroke-width="4" stroke-dasharray="6,6"/>

  <!-- Receivers box -->
  <rect x="160" y="440" width="1120" height="310" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="6" rx="12"/>

  <!-- Receiver A -->
  <rect x="200" y="470" width="1040" height="60" fill="#ffffff" stroke="#bbbbbb" stroke-width="6" rx="8"/>
  <text x="230" y="510" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">接收方 A (4G手机, ~1Mbps)</text>
  <text x="1040" y="510" font-size="22" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif">只加入 G0+G1 → 720p</text>

  <!-- Receiver B -->
  <rect x="200" y="544" width="1040" height="60" fill="#ffffff" stroke="#bbbbbb" stroke-width="6" rx="8"/>
  <text x="230" y="584" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">接收方 B (WiFi, ~5Mbps)</text>
  <text x="1040" y="584" font-size="22" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif">加入 G0+G1+G2 → 4K</text>

  <!-- Receiver C -->
  <rect x="200" y="618" width="1040" height="60" fill="#ffffff" stroke="#bbbbbb" stroke-width="6" rx="8"/>
  <text x="230" y="658" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">接收方 C (2G弱网, ~300kbps)</text>
  <text x="1040" y="658" font-size="22" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif">只加入 G0 → 360p 基础</text>

  <!-- Footer comparison -->
  <text x="40" y="784" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">最低公共质量方案: 所有人都被迫看 360p | 层次编码: 各取所需，不互相拖累</text>
</svg>