<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="300" fill="#ffffff" rx="16"/>
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">视频帧拆分为多个包</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="6"/>

  <!-- Frame label -->
  <text x="40" y="136" font-size="26" fill="#0d6b2e" font-family="system-ui, -apple-system, sans-serif">视频帧 N (timestamp = 90000)</text>

  <!-- 4 packets -->
  <rect x="60" y="156" width="304" height="80" fill="#f0f0f0" stroke="#991b1b" stroke-width="6" rx="12"/>
  <text x="212" y="192" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">P1 seq=100</text>
  <text x="212" y="224" font-size="22" fill="#555555" font-family="monospace" text-anchor="middle">ts=90000</text>

  <rect x="384" y="156" width="304" height="80" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="6" rx="12"/>
  <text x="536" y="192" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">P2 seq=101</text>
  <text x="536" y="224" font-size="22" fill="#555555" font-family="monospace" text-anchor="middle">ts=90000</text>

  <rect x="708" y="156" width="304" height="80" fill="#f0f0f0" stroke="#0d6b2e" stroke-width="6" rx="12"/>
  <text x="860" y="192" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">P3 seq=102</text>
  <text x="860" y="224" font-size="22" fill="#555555" font-family="monospace" text-anchor="middle">ts=90000</text>

  <rect x="1032" y="156" width="304" height="80" fill="#f0f0f0" stroke="#991b1b" stroke-width="6" rx="12"/>
  <text x="1184" y="192" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">P4 seq=103</text>
  <text x="1184" y="224" font-size="22" fill="#555555" font-family="monospace" text-anchor="middle">ts=90000</text>

  <!-- Bottom note -->
  <text x="720" y="276" font-size="22" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">timestamp 全部相同 → 只有 seq 能区分这些包</text>
</svg>
