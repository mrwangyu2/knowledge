<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="580" fill="#ffffff" rx="16"/>
  <text x="720" y="60" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SSRC 与 CSRC：身份转变</text>
  <line x1="40" y1="88" x2="1400" y2="88" stroke="#bbbbbb" stroke-width="6"/>

  <!-- SSRC section -->
  <text x="40" y="144" font-size="26" font-weight="bold" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">SSRC=0x4A7B (在 Alice 自己的包里)</text>
  <rect x="60" y="164" width="1280" height="84" fill="#f0f0f0" stroke="#991b1b" stroke-width="6" rx="12"/>
  <rect x="70" y="174" width="236" height="64" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="4" rx="8"/>
  <text x="188" y="214" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">时钟 8000Hz</text>
  <rect x="316" y="174" width="236" height="64" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="4" rx="8"/>
  <text x="434" y="214" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">序号 42</text>
  <rect x="562" y="174" width="236" height="64" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="4" rx="8"/>
  <text x="680" y="214" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">丢包统计</text>
  <rect x="808" y="174" width="236" height="64" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="4" rx="8"/>
  <text x="926" y="214" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">抖动缓冲</text>
  <rect x="1054" y="174" width="276" height="64" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="4" rx="8"/>
  <text x="1192" y="214" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">同步对齐</text>
  <text x="720" y="276" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">接收方以 SSRC 为 key 维护整条时间线 — 值驱动</text>

  <!-- Big arrow down -->
  <line x1="720" y1="296" x2="720" y2="356" stroke="#1a3f8a" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- CSRC section -->
  <text x="40" y="404" font-size="26" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif">CSRC={0x4A7B, ...} (在 Mixer 的包里)</text>
  <rect x="60" y="424" width="1280" height="84" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="6" rx="12"/>
  <rect x="150" y="438" width="400" height="56" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="4" rx="8"/>
  <text x="350" y="476" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">标签："Alice 说了话"</text>
  <text x="980" y="476" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">接收方只用来做 UI 指示，不做任何时序处理</text>
</svg>
