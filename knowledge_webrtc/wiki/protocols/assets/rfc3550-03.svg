<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="1040" fill="#ffffff" rx="16"/>
  <!-- 收到UDP包 -->
  <rect x="520" y="40" width="400" height="68" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="720" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">收到 UDP 包</text>
  <!-- Arrow 1 -->
  <line x1="720" y1="108" x2="720" y2="164" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- IP+Port -->
  <rect x="420" y="172" width="600" height="108" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="720" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">IP + Port → 找到 Session</text>
  <text x="720" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">传输层做的 (操作系统 socket)</text>
  <!-- Arrow 2 -->
  <line x1="720" y1="280" x2="720" y2="336" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- SSRC -->
  <rect x="420" y="344" width="600" height="108" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="720" y="388" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">SSRC → 找到 Session 内的流</text>
  <text x="720" y="428" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">RTP 层做的 (读 RTP 头)</text>
  <!-- Arrow 3 -->
  <line x1="720" y1="452" x2="720" y2="508" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- PT -->
  <rect x="420" y="516" width="600" height="108" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="720" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">PT → 找到解码器</text>
  <text x="720" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">RTP 层做的 (读 RTP 头)</text>
  <!-- Arrow 4 -->
  <line x1="720" y1="624" x2="720" y2="680" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- Seq+TS -->
  <rect x="420" y="688" width="600" height="108" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="720" y="732" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">Seq + TS → 找到包的位置</text>
  <text x="720" y="772" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">丢包检测 + 播放时刻</text>
  <!-- Arrow 5 -->
  <line x1="720" y1="796" x2="720" y2="852" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- Payload -->
  <rect x="520" y="860" width="400" height="68" fill="#0d6b2e" fill-opacity="0.2" stroke="#0d6b2e" stroke-width="6" rx="12"/>
  <text x="720" y="904" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#0d6b2e">Payload → 解码播放</text>
  <!-- Layer labels on right -->
  <text x="1080" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8b6508">传输层</text>
  <text x="1080" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8b6508">RTP 层</text>
  <text x="1080" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8b6508">RTP 层</text>
  <text x="1080" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8b6508">RTP 层</text>
</svg>
