<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="560" fill="#ffffff" rx="16"/>
  <text x="720" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">简单多播音频会议</text>
  <line x1="60" y1="72" x2="1380" y2="72" stroke="#bbbbbb" stroke-width="6"/>
  <!-- 4 participants -->
  <rect x="100" y="104" width="200" height="72" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="200" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">A</text>
  <rect x="400" y="104" width="200" height="72" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="500" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">B</text>
  <rect x="700" y="104" width="200" height="72" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="800" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">C</text>
  <rect x="1000" y="104" width="200" height="72" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="1100" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a3f8a">D</text>
  <!-- Connecting lines from nodes down -->
  <line x1="200" y1="176" x2="200" y2="220" stroke="#1a3f8a" stroke-width="4.8"/>
  <line x1="500" y1="176" x2="500" y2="220" stroke="#1a3f8a" stroke-width="4.8"/>
  <line x1="800" y1="176" x2="800" y2="220" stroke="#1a3f8a" stroke-width="4.8"/>
  <line x1="1100" y1="176" x2="1100" y2="220" stroke="#1a3f8a" stroke-width="4.8"/>
  <!-- Horizontal to center -->
  <line x1="200" y1="220" x2="1100" y2="220" stroke="#1a3f8a" stroke-width="4.8"/>
  <line x1="650" y1="220" x2="650" y2="260" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- IP多播组 -->
  <rect x="280" y="270" width="740" height="160" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="650" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">IP 多播组地址+端口对</text>
  <text x="650" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#0d6b2e">音频: 偶数端口</text>
  <text x="650" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8b6508">RTCP: 奇数端口</text>
  <text x="1080" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">RTP+RTCP</text>
  <text x="1080" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">端口分离</text>
</svg>
