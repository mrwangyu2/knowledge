<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect width="1440" height="300" fill="#ffffff" rx="16"/>

  <!-- Title -->
  <text x="40" y="56" font-size="26" font-weight="bold" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">序列号不够：多源混流时无法区分包属于谁</text>

  <!-- Subtitle -->
  <text x="40" y="104" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">接收方在同一 UDP socket 收到的混流:</text>

  <!-- Sequence packets -->
  <rect x="40" y="128" width="112" height="56" fill="#1a3f8a" opacity="0.4" rx="8"/>
  <text x="96" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=1</text>

  <rect x="164" y="128" width="112" height="56" fill="#0d6b2e" opacity="0.4" rx="8"/>
  <text x="220" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=1</text>

  <rect x="288" y="128" width="112" height="56" fill="#8b6508" opacity="0.4" rx="8"/>
  <text x="344" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=2</text>

  <rect x="412" y="128" width="112" height="56" fill="#4c1d95" opacity="0.4" rx="8"/>
  <text x="468" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=1</text>

  <rect x="536" y="128" width="112" height="56" fill="#991b1b" opacity="0.4" rx="8"/>
  <text x="592" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=3</text>

  <rect x="660" y="128" width="112" height="56" fill="#1a3f8a" opacity="0.4" rx="8"/>
  <text x="716" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=2</text>

  <rect x="784" y="128" width="112" height="56" fill="#0d6b2e" opacity="0.4" rx="8"/>
  <text x="840" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=2</text>

  <rect x="908" y="128" width="112" height="56" fill="#8b6508" opacity="0.4" rx="8"/>
  <text x="964" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=3</text>

  <rect x="1032" y="128" width="112" height="56" fill="#4c1d95" opacity="0.4" rx="8"/>
  <text x="1088" y="166" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">seq=4</text>

  <!-- Arrow pointing to the first three seq=1 -->
  <line x1="344" y1="20" x2="152" y2="116" stroke="#991b1b" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Annotation -->
  <text x="400" y="230" font-size="22" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">这 3 个 seq=1 分别属于谁？序列号只管"第几个"，不管"谁的"</text>
</svg>