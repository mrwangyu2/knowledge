<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 580">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="580" fill="#ffffff" rx="16"/>
  <text x="720" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">CNAME = 跨 Session 的用户唯一标识</text>
  <line x1="60" y1="72" x2="1380" y2="72" stroke="#bbbbbb" stroke-width="3"/>
  <!-- Alice's audio session -->
  <rect x="80" y="100" width="620" height="90" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="12"/>
  <text x="110" y="144" font-family="monospace" font-size="24" fill="#16a34a">音频 Session: SDES { SSRC=A1,</text>
  <text x="130" y="176" font-family="monospace" font-size="24" fill="#16a34a">CNAME="alice@pc1" }</text>
  <!-- Alice's video session -->
  <rect x="740" y="100" width="620" height="90" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="12"/>
  <text x="770" y="144" font-family="monospace" font-size="24" fill="#16a34a">视频 Session: SDES { SSRC=A2,</text>
  <text x="790" y="176" font-family="monospace" font-size="24" fill="#16a34a">CNAME="alice@pc1" }</text>
  <!-- Arrow showing same CNAME -->
  <line x1="700" y1="144" x2="740" y2="144" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#16a34a">CNAME 相同</text>
  <!-- Receiver box -->
  <rect x="80" y="230" width="1280" height="140" fill="#ffffff" stroke="#16a34a" stroke-width="3" rx="12"/>
  <text x="120" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#16a34a">接收方:</text>
  <text x="120" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">发现 A1 和 A2 的 CNAME 相同 → 来自同一个 Alice</text>
  <text x="120" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">→ 将这个人的音频流和视频流绑定播放 → 用 NTP 时间戳做唇音同步</text>
  <!-- CNAME requirements -->
  <rect x="80" y="400" width="1280" height="150" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="12"/>
  <text x="120" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#b8860b">CNAME 要求 (RFC 3550):</text>
  <text x="120" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">格式: user@host 或 host | 唯一性: 同一 RTP Session 内全局唯一</text>
  <text x="120" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">稳定性: 跨多个 RTP Session 保持不变 | 算法生成: 非手动输入，防止重名</text>
</svg>
