<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1440" height="440" fill="#ffffff" rx="16"/>
  <!-- Title -->
  <text x="40" y="60" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">Mixer RTCP: 为什么 RR 不跨云?</text>
  <!-- High-speed cloud -->
  <rect x="40" y="100" width="360" height="100" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="220" y="144" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">高速云 (A, B, C)</text>
  <text x="220" y="180" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">Mixer 收到 A 的 SR</text>
  <!-- Mixer box -->
  <rect x="520" y="100" width="400" height="100" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="12"/>
  <text x="720" y="144" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">Mixer</text>
  <text x="720" y="180" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">产生对 A 的 RR</text>
  <!-- Low-speed cloud -->
  <rect x="1040" y="100" width="360" height="100" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="1220" y="144" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">低速云 (D)</text>
  <text x="1220" y="180" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">看到 A 的丢包率 30%</text>
  <!-- Arrows -->
  <line x1="920" y1="150" x2="1030" y2="150" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" stroke-dasharray="8"/>
  <text x="976" y="130" text-anchor="middle" font-size="20" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">❌</text>
  <line x1="400" y1="150" x2="510" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="456" y="130" text-anchor="middle" font-size="20" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif">✓ RR</text>
  <!-- Explanation -->
  <rect x="40" y="240" width="1360" height="160" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="70" y="284" font-size="22" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">如果 Mixer 把高速云的 RR 发给 D...</text>
  <text x="70" y="320" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">D 看到 A 的丢包率 30% → 但 A 在高速云 → D 无法判断是高速云内部还是低速链路的问题</text>
  <text x="70" y="360" font-size="22" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">→ RR 只发给高速云 → A 能判断高速云内部的接收质量</text>
</svg>
