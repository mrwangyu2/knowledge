<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="500" fill="#ffffff" rx="16"/>
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">MPEG 传输顺序 vs 显示顺序</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="3"/>

  <text x="40" y="132" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">B 帧需参考前后帧，传输顺序与显示顺序不同</text>

  <!-- Display order -->
  <rect x="60" y="156" width="1320" height="104" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="100" y="196" font-size="22" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">显示顺序：</text>
  <rect x="240" y="168" width="220" height="60" fill="#bbbbbb" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="350" y="208" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">I (ts=0)</text>
  <rect x="480" y="168" width="220" height="60" fill="#bbbbbb" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="590" y="208" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">B (ts=3000)</text>
  <rect x="720" y="168" width="220" height="60" fill="#bbbbbb" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="830" y="208" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">B (ts=6000)</text>
  <rect x="960" y="168" width="220" height="60" fill="#bbbbbb" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="1070" y="208" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">P (ts=9000)</text>

  <!-- Arrow between -->
  <line x1="720" y1="268" x2="720" y2="304" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Transmission order -->
  <rect x="60" y="308" width="1320" height="104" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="100" y="348" font-size="22" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">传输顺序：</text>
  <rect x="240" y="320" width="220" height="60" fill="#bbbbbb" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="350" y="360" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">I (seq=1, ts=0)</text>
  <rect x="480" y="320" width="220" height="60" fill="#bbbbbb" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="590" y="360" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">P (seq=2, ts=9000)</text>
  <rect x="720" y="320" width="220" height="60" fill="#bbbbbb" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="830" y="360" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">B (seq=3, ts=3000)</text>
  <rect x="960" y="320" width="220" height="60" fill="#bbbbbb" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="1070" y="360" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">B (seq=4, ts=6000)</text>

  <!-- Bottom summary -->
  <rect x="60" y="440" width="1320" height="44" fill="#bbbbbb" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="720" y="472" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Seq: 单调 1→2→3→4 (检测丢包) / Ts: 非单调 0→9000→3000→6000 (恢复播放顺序)</text>
</svg>
