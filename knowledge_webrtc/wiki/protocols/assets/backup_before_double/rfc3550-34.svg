<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 280">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1440" height="280" fill="#ffffff" rx="16"/>

  <!-- Title -->
  <text x="40" y="56" font-size="26" font-weight="bold" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">时间戳也不够：每个源的时间戳从不同随机初始值开始</text>

  <!-- Alice row -->
  <text x="80" y="116" font-size="24" font-weight="bold" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif">Alice:</text>

  <rect x="190" y="90" width="144" height="44" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="8"/>
  <text x="262" y="120" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">ts=160</text>

  <rect x="350" y="90" width="144" height="44" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="8"/>
  <text x="422" y="120" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">ts=320</text>

  <rect x="510" y="90" width="144" height="44" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="8"/>
  <text x="582" y="120" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">ts=480</text>

  <text x="680" y="120" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">(初始值随机 = 0)</text>

  <!-- Bob row -->
  <text x="80" y="184" font-size="24" font-weight="bold" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">Bob:</text>

  <rect x="190" y="158" width="144" height="44" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="262" y="188" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">ts=8450</text>

  <rect x="350" y="158" width="144" height="44" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="422" y="188" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">ts=8610</text>

  <rect x="510" y="158" width="144" height="44" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="582" y="188" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">ts=8770</text>

  <text x="680" y="188" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">(初始值随机 = 8290)</text>

  <!-- Conclusion -->
  <text x="80" y="256" font-size="22" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">时间戳只能告诉你"什么时候"，不能告诉你"谁的" — 没有统一坐标系</text>
</svg>