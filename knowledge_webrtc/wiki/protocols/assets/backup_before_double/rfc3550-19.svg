<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="400" fill="#ffffff" rx="16"/>
  <!-- Title -->
  <text x="40" y="60" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">解法: Translator 桥接穿透防火墙</text>
  <!-- Left: Public multicast -->
  <rect x="40" y="96" width="480" height="170" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="280" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">公网多播</text>
  <text x="280" y="184" text-anchor="middle" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">Translator (外)</text>
  <text x="280" y="224" text-anchor="middle" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">接收多播包 → 封装为单播</text>
  <text x="280" y="252" text-anchor="middle" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">→ 发给内网 Translator</text>
  <!-- Tunnel -->
  <rect x="520" y="156" width="360" height="48" fill="#ffffff" stroke="#2563eb" stroke-width="3" rx="8" stroke-dasharray="8"/>
  <text x="700" y="188" text-anchor="middle" font-size="22" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif">隧道 (UDP/TCP) 穿防火墙</text>
  <!-- Arrow right -->
  <line x1="520" y1="180" x2="514" y2="180" stroke="#2563eb" stroke-width="3"/>
  <!-- Right: Enterprise intranet -->
  <rect x="880" y="96" width="520" height="170" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="1140" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">防火墙后内网</text>
  <text x="1140" y="184" text-anchor="middle" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">Translator (内)</text>
  <text x="1140" y="224" text-anchor="middle" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">接收隧道包 → 还原为多播</text>
  <text x="1140" y="252" text-anchor="middle" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">→ 发给内网用户</text>
  <!-- Key points -->
  <rect x="40" y="296" width="1360" height="80" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="70" y="336" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">关键: 不改变 SSRC、不混合、不改编码（除非需要）。内网用户看到的 SSRC 与公网完全一致。</text>
</svg>
