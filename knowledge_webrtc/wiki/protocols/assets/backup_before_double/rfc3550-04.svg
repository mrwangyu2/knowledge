<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 380">
  <rect width="1440" height="380" fill="#ffffff" rx="16"/>
  <text x="40" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a">Session 数不随人数增长</text>
  <rect x="40" y="84" width="1360" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="80" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">场景一: 1 个 Session (纯音频) — 3 人也 1 个, 1000 人也 1 个</text>
  <rect x="40" y="176" width="1360" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="80" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">场景二: 2 个 Session (音频+视频) — 3 人也 2 个, 1000 人也 2 个</text>
  <rect x="40" y="268" width="1360" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="80" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">场景四: 多个 Session (每层一个) — 层数决定, 与人无关</text>
</svg>
