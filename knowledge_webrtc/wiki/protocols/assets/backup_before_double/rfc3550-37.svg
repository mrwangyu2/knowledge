<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="840" fill="#ffffff" rx="16"/>
  <text x="720" y="60" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mixer 内部处理：SSRC → CSRC</text>
  <line x1="40" y1="88" x2="1400" y2="88" stroke="#bbbbbb" stroke-width="3"/>

  <!-- Input label -->
  <text x="40" y="140" font-size="26" font-weight="bold" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">输入 (3 个包, 3 个 SSRC)：</text>

  <!-- Input packet 1 -->
  <rect x="120" y="164" width="1000" height="84" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="150" y="204" font-size="24" fill="#1a1a1a" font-family="monospace">SSRC=A  seq=42  ts=6720  payload=...</text>
  <text x="150" y="236" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">Alice 控制时钟和序号</text>

  <!-- Input packet 2 -->
  <rect x="120" y="268" width="1000" height="64" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="150" y="308" font-size="24" fill="#1a1a1a" font-family="monospace">SSRC=B  seq=18  ts=2880  payload=...</text>

  <!-- Plus -->
  <text x="60" y="328" font-size="32" fill="#2563eb" font-family="monospace">+</text>

  <!-- Arrow down from inputs -->
  <line x1="620" y1="344" x2="620" y2="420" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Process label -->
  <rect x="290" y="420" width="660" height="96" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="620" y="460" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mixer 重建时序 + 混合 + 转码</text>
  <text x="620" y="496" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">seq 和 ts 全部丢弃，只保留 SSRC 值和音频数据</text>

  <!-- Arrow down -->
  <line x1="620" y1="520" x2="620" y2="590" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Output label -->
  <text x="40" y="630" font-size="26" font-weight="bold" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">输出 (1 个包)：</text>

  <!-- Output packet -->
  <rect x="120" y="650" width="1120" height="104" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="150" y="690" font-size="24" fill="#dc2626" font-family="monospace">SSRC=M  seq=100  ts=16000</text>
  <text x="150" y="730" font-size="24" fill="#2563eb" font-family="monospace">CSRC=[A, B]  payload = 混合后的音频数据</text>

  <!-- Bottom note -->
  <text x="720" y="800" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SSRC 值 A/B 原值搬运到 CSRC 列表，身份从"时钟掌控者"变为"内容贡献者"</text>
</svg>
