<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="600" fill="#ffffff" rx="16"/>
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">RTCP 复合包结构 (每次必须发送)</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="3"/>

  <!-- 4 boxes -->
  <rect x="60" y="120" width="300" height="112" fill="#f0f0f0" stroke="#dc2626" stroke-width="3" rx="12"/>
  <text x="210" y="164" font-size="26" font-weight="bold" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SR 或 RR</text>
  <text x="210" y="204" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">(必须第一个)</text>

  <line x1="380" y1="176" x2="430" y2="176" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="450" y="120" width="320" height="112" fill="#f0f0f0" stroke="#2563eb" stroke-width="4" rx="12"/>
  <text x="610" y="164" font-size="26" font-weight="bold" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SDES</text>
  <text x="610" y="204" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">(含 CNAME)</text>

  <line x1="790" y1="176" x2="840" y2="176" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="860" y="120" width="240" height="112" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="980" y="164" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BYE</text>
  <text x="980" y="204" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">(可选)</text>

  <line x1="1120" y1="176" x2="1170" y2="176" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1190" y="120" width="190" height="112" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="1284" y="164" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">APP</text>
  <text x="1284" y="204" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">(可选)</text>

  <!-- Rules section -->
  <rect x="60" y="268" width="1320" height="304" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="100" y="316" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">规则：</text>

  <rect x="100" y="340" width="36" height="36" fill="#dc2626" rx="18"/>
  <text x="118" y="366" font-size="22" fill="#ffffff" font-family="monospace" text-anchor="middle">1</text>
  <text x="156" y="366" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">第一个包必须是 SR 或 RR（即使 RC=0 空报告也必须发送）</text>

  <rect x="100" y="396" width="36" height="36" fill="#2563eb" rx="18"/>
  <text x="118" y="422" font-size="22" fill="#ffffff" font-family="monospace" text-anchor="middle">2</text>
  <text x="156" y="422" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">必须包含 SDES CNAME（每个参与者都要声明自己的规范名）</text>

  <rect x="100" y="452" width="36" height="36" fill="#16a34a" rx="18"/>
  <text x="118" y="478" font-size="22" fill="#ffffff" font-family="monospace" text-anchor="middle">3</text>
  <text x="156" y="478" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">BYE 应该是最后一个（离开通知放在末尾）</text>

  <rect x="100" y="508" width="36" height="36" fill="#555555" rx="18"/>
  <text x="118" y="534" font-size="22" fill="#ffffff" font-family="monospace" text-anchor="middle">4</text>
  <text x="156" y="534" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">每个报告间隔只发一个复合包（所有 RTCP 信息打包在一起）</text>
</svg>
