<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="320" fill="#ffffff" rx="16"/>
  <!-- Title -->
  <text x="40" y="60" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">问题: 防火墙阻断多播</text>
  <!-- Public multicast -->
  <rect x="40" y="96" width="640" height="170" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="360" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">公网多播 (224.0.0.x)</text>
  <text x="360" y="184" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">A → 多播包</text>
  <text x="360" y="216" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">B → 多播包</text>
  <text x="360" y="248" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">C → 多播包</text>
  <!-- Firewall -->
  <rect x="690" y="96" width="60" height="170" fill="#dc2626" stroke="#dc2626" stroke-width="3" rx="6"/>
  <text x="720" y="190" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">阻</text>
  <text x="720" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">断</text>
  <!-- Enterprise intranet -->
  <rect x="760" y="96" width="640" height="170" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="1080" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">企业内网</text>
  <text x="1080" y="190" text-anchor="middle" font-size="22" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">内网用户无法收到</text>
  <text x="1080" y="230" text-anchor="middle" font-size="22" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">任何公网多播包</text>
</svg>
