<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="800" fill="#ffffff" rx="16"/>

  <!-- Title -->
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mixer: 混合多流为单流</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="3"/>

  <!-- Zone labels -->
  <text x="320" y="124" font-size="26" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">高速区 (多播)</text>
  <text x="1120" y="124" font-size="26" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">低速区 (单播)</text>

  <!-- A, B, C boxes -->
  <rect x="90" y="144" width="140" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="160" y="192" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">A</text>

  <rect x="310" y="144" width="140" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="380" y="192" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">B</text>

  <rect x="530" y="144" width="140" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="600" y="192" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">C</text>

  <text x="380" y="256" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">各自发送 RTP 流</text>

  <!-- Converging arrows from A/B/C to Mixer -->
  <line x1="160" y1="220" x2="400" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="380" y1="220" x2="720" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="220" x2="1040" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Mixer box -->
  <rect x="260" y="290" width="920" height="310" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="12"/>

  <text x="300" y="334" font-size="26" font-weight="bold" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif">Mixer</text>
  <text x="300" y="374" font-size="22" fill="#555555" font-family="monospace">SSRC = X  |  CSRC = [A, B, C]</text>
  <line x1="300" y1="388" x2="1140" y2="388" stroke="#bbbbbb" stroke-width="1"/>

  <text x="300" y="424" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">1. 接收 A、B、C 的音频包</text>
  <text x="300" y="460" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">2. 重建每路 20ms 均匀时序</text>
  <text x="300" y="496" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">3. 混合为一路音频</text>
  <text x="300" y="532" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">4. 转码为低带宽编码 (GSM 13kbps)</text>
  <text x="300" y="568" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">5. 用自己的 SSRC=X 发送，CSRC=[A, B, C]</text>

  <!-- Arrow from Mixer to D -->
  <line x1="720" y1="600" x2="720" y2="650" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="790" y="632" font-size="22" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">1 路 13kbps GSM</text>

  <!-- D box -->
  <rect x="620" y="650" width="200" height="76" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <text x="720" y="698" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="monospace" text-anchor="middle">D</text>

  <text x="720" y="766" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">收到 1 路流，解码后直接播放；通过 CSRC 知道当前谁在说话</text>
</svg>
