<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560">
  <rect width="1440" height="560" fill="#ffffff" rx="16"/>
  <text x="720" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">音视频会议</text>
  <line x1="60" y1="72" x2="1380" y2="72" stroke="#bbbbbb" stroke-width="3"/>
  <!-- Audio Session box -->
  <rect x="80" y="104" width="1280" height="130" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <rect x="110" y="120" width="200" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="210" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#2563eb">音频 RTP Session</text>
  <text x="340" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">端口: 5004/5005 | SSRC_Audio</text>
  <text x="110" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#16a34a">RTP: 5004 (偶数) | RTCP: 5005 (奇数)</text>
  <!-- Video Session box -->
  <rect x="80" y="260" width="1280" height="130" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>
  <rect x="110" y="276" width="200" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="210" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#2563eb">视频 RTP Session</text>
  <text x="340" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a1a">端口: 5006/5007 | SSRC_Video</text>
  <text x="110" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#16a34a">RTP: 5006 (偶数) | RTCP: 5007 (奇数)</text>
  <!-- Key design points -->
  <rect x="80" y="416" width="1280" height="116" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" rx="12"/>
  <text x="120" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#1a1a1a">关键设计:</text>
  <text x="120" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">- 音视频用不同 RTP Session (不同端口对/多播地址) | - RTP 层面音视频无直接耦合</text>
  <text x="120" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">- 通过 RTCP 中 CNAME 关联同一用户 | - 通过 RTCP SR NTP 时间戳实现音视频同步</text>
</svg>
