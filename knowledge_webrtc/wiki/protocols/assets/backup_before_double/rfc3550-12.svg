<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400">
  <rect width="1440" height="400" fill="#ffffff" rx="16"/>
  <!-- Title bar -->
  <rect x="60" y="40" width="620" height="60" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="3" rx="8"/>
  <text x="370" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#2563eb">音频</text>
  <rect x="700" y="40" width="680" height="60" fill="#b8860b" fill-opacity="0.15" stroke="#b8860b" stroke-width="3" rx="8"/>
  <text x="1040" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#b8860b">视频</text>
  <!-- Row 1 -->
  <rect x="60" y="112" width="620" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="100" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#dc2626">丢一个包 = 20ms 静音</text>
  <rect x="700" y="112" width="680" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="740" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#dc2626">丢一个包 = 整帧花屏</text>
  <!-- Row 2 -->
  <rect x="60" y="180" width="620" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="100" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#1a1a1a">PLC 可掩盖 1-2 个包</text>
  <rect x="700" y="180" width="680" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="740" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#1a1a1a">关键帧丢 = 几秒花</text>
  <!-- Row 3 -->
  <rect x="60" y="248" width="620" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="100" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#16a34a">可容忍 3-5% 丢包率</text>
  <rect x="700" y="248" width="680" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="740" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#16a34a">需要 &lt;1% 丢包率</text>
  <!-- Row 4 -->
  <rect x="60" y="316" width="620" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="100" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#1a1a1a">码率低 (8-64kbps)</text>
  <rect x="700" y="316" width="680" height="56" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="2" rx="8"/>
  <text x="740" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#1a1a1a">码率高 (100-5000kbps)</text>
</svg>
