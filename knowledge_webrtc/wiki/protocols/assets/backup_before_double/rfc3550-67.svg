<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="600" fill="#ffffff" rx="16"/>

  <!-- Title -->
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">WebRTC 协议栈中 RTP/RTCP 的位置</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="3"/>

  <!-- Outer box -->
  <rect x="60" y="110" width="1320" height="456" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="12"/>

  <!-- Layer 1: Application -->
  <rect x="120" y="136" width="1200" height="80" fill="#f0f0f0" stroke="#dc2626" stroke-width="3" rx="8"/>
  <text x="180" y="186" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">应用层：音视频编解码（Opus, H.264, VP8）</text>

  <!-- Layer 2: Transport - SRTP/SRTCP (highlighted) -->
  <rect x="120" y="224" width="1200" height="80" fill="#f0f0f0" stroke="#2563eb" stroke-width="4" rx="8"/>
  <text x="180" y="274" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">传输层：SRTP / SRTCP（加密 RTP/RTCP）</text>
  <text x="1220" y="274" font-size="22" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">◀ 这里</text>

  <!-- Layer 3: Network -->
  <rect x="120" y="312" width="1200" height="80" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="180" y="362" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">网络层：ICE + STUN + TURN（NAT 穿透）</text>

  <!-- Layer 4: Transport (UDP/TCP) -->
  <rect x="120" y="400" width="1200" height="80" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="3" rx="8"/>
  <text x="180" y="450" font-size="24" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">传输层：UDP（或 TCP）</text>

  <!-- Layer annotations on left -->
  <line x1="100" y1="176" x2="110" y2="176" stroke="#dc2626" stroke-width="3"/>
  <line x1="100" y1="264" x2="110" y2="264" stroke="#2563eb" stroke-width="4"/>
  <line x1="100" y1="352" x2="110" y2="352" stroke="#16a34a" stroke-width="3"/>
  <line x1="100" y1="440" x2="110" y2="440" stroke="#bbbbbb" stroke-width="3"/>

  <!-- Bottom note outside the outer box -->
  <text x="720" y="590" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">WebRTC 使用 SRTP 保护 RTP 数据（加密+认证），RTCP 反馈机制用于带宽估计（REMB/GCC）</text>
</svg>
