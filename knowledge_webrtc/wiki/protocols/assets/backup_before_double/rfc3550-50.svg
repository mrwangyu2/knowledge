<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="480" fill="#ffffff" rx="16"/>
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PLC 丢包隐藏 — 核心思想</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="3"/>

  <!-- Original sequence -->
  <text x="60" y="136" font-size="24" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">原始：</text>
  <rect x="180" y="108" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="310" y="144" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P1] OK</text>
  <text x="310" y="172" font-size="20" fill="#555555" font-family="monospace" text-anchor="middle">████</text>

  <rect x="460" y="108" width="260" height="60" fill="#f0f0f0" stroke="#dc2626" stroke-width="3" rx="8"/>
  <text x="590" y="144" font-size="22" fill="#dc2626" font-family="monospace" text-anchor="middle">[P2] 丢了!</text>
  <text x="590" y="172" font-size="20" fill="#555555" font-family="monospace" text-anchor="middle">████</text>

  <rect x="740" y="108" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="870" y="144" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P3] OK</text>
  <text x="870" y="172" font-size="20" fill="#555555" font-family="monospace" text-anchor="middle">████</text>

  <rect x="1020" y="108" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="1150" y="144" font-size="22" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P4] OK</text>
  <text x="1150" y="172" font-size="20" fill="#555555" font-family="monospace" text-anchor="middle">████</text>

  <!-- Arrow down -->
  <line x1="720" y1="184" x2="720" y2="224" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- No fill option -->
  <text x="60" y="264" font-size="24" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif">不填补：</text>
  <rect x="200" y="236" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="330" y="274" font-size="20" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P1] OK</text>

  <rect x="480" y="236" width="260" height="60" fill="#dc2626" opacity="0.15" stroke="#dc2626" stroke-width="3" rx="8"/>
  <text x="610" y="274" font-size="20" fill="#dc2626" font-family="monospace" text-anchor="middle">无声 / 咔嗒声</text>

  <rect x="760" y="236" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="890" y="274" font-size="20" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P3] OK</text>

  <rect x="1040" y="236" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="1170" y="274" font-size="20" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P4] OK</text>

  <text x="610" y="324" font-size="20" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">用户体验极差</text>

  <!-- Arrow down -->
  <line x1="720" y1="340" x2="720" y2="380" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PLC option -->
  <text x="60" y="420" font-size="24" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif">PLC：</text>
  <rect x="200" y="392" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="330" y="430" font-size="20" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P1] OK</text>

  <rect x="480" y="392" width="260" height="60" fill="#f0f0f0" stroke="#2563eb" stroke-width="3" rx="8"/>
  <text x="610" y="430" font-size="20" fill="#2563eb" font-family="monospace" text-anchor="middle">~ 合成 ~</text>

  <rect x="760" y="392" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="890" y="430" font-size="20" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P3] OK</text>

  <rect x="1040" y="392" width="260" height="60" fill="#f0f0f0" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="1170" y="430" font-size="20" fill="#1a1a1a" font-family="monospace" text-anchor="middle">[P4] OK</text>

  <text x="610" y="480" font-size="20" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">根据前后包生成过渡音频</text>
</svg>
