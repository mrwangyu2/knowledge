<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="460" fill="#ffffff" rx="16"/>
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">NTP 时间戳：跨媒体同步</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="6"/>

  <text x="40" y="132" font-size="24" fill="#555555" font-family="system-ui, -apple-system, sans-serif">通过 RTCP SR 中的 NTP 时间戳关联不同媒体的 RTP 时间戳</text>

  <!-- Audio branch -->
  <rect x="80" y="160" width="560" height="100" fill="#f0f0f0" stroke="#991b1b" stroke-width="6" rx="12"/>
  <text x="360" y="200" font-size="26" font-weight="bold" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">音频 (8kHz)</text>
  <text x="360" y="240" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">RTP TS = 160</text>

  <!-- Video branch -->
  <rect x="800" y="160" width="560" height="100" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="6" rx="12"/>
  <text x="1080" y="200" font-size="26" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">视频 (90kHz)</text>
  <text x="1080" y="240" font-size="24" fill="#1a1a1a" font-family="monospace" text-anchor="middle">RTP TS = 1800</text>

  <!-- Converging arrows -->
  <line x1="360" y1="264" x2="360" y2="310" stroke="#991b1b" stroke-width="6"/>
  <line x1="360" y1="310" x2="720" y2="350" stroke="#991b1b" stroke-width="6"/>
  <line x1="1080" y1="264" x2="1080" y2="310" stroke="#1a3f8a" stroke-width="6"/>
  <line x1="1080" y1="310" x2="720" y2="350" stroke="#1a3f8a" stroke-width="6"/>

  <!-- Center NTP box -->
  <rect x="460" y="344" width="520" height="80" fill="#f0f0f0" stroke="#0d6b2e" stroke-width="8" rx="12"/>
  <text x="720" y="380" font-size="24" fill="#0d6b2e" font-family="monospace" text-anchor="middle">对应同一 NTP 时间戳</text>
  <text x="720" y="412" font-size="20" fill="#555555" font-family="monospace" text-anchor="middle">关联音频与视频</text>

  <!-- NTP format note -->
  <text x="720" y="456" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">NTP = 64 位 (32 位整数秒 + 32 位小数秒)，自 1900-01-01 00:00:00 UTC 起算</text>
</svg>
