<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="550" fill="#ffffff" rx="16"/>

  <!-- Title -->
  <text x="720" y="56" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mixer 输出包结构: SSRC + CSRC</text>
  <line x1="40" y1="84" x2="1400" y2="84" stroke="#bbbbbb" stroke-width="6"/>

  <!-- Packet outer box -->
  <rect x="60" y="110" width="1320" height="150" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="90" y="100" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">RTP Packet</text>

  <!-- SSRC section (left) -->
  <rect x="90" y="134" width="600" height="96" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="6" rx="8"/>
  <text x="120" y="174" font-size="24" fill="#1a3f8a" font-family="monospace">SSRC = Mixer_ID</text>
  <text x="120" y="210" font-size="20" fill="#555555" font-family="monospace">序列号空间 + 时间戳空间</text>

  <!-- CSRC section (right) -->
  <rect x="720" y="134" width="630" height="96" fill="#f0f0f0" stroke="#0d6b2e" stroke-width="6" rx="8"/>
  <text x="750" y="174" font-size="24" fill="#0d6b2e" font-family="monospace">CSRC = [SSRC_A, SSRC_B, SSRC_C]</text>
  <text x="750" y="210" font-size="20" fill="#555555" font-family="monospace">这个包包含了这三人的声音</text>

  <!-- Annotation below packet -->
  <text x="720" y="296" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">每个 RTP 包都携带 SSRC + CSRC，指明此包混合了哪些源</text>

  <!-- Receiver perspective section -->
  <rect x="60" y="324" width="260" height="48" fill="#bbbbbb" rx="8"/>
  <text x="190" y="358" font-size="24" font-weight="bold" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">接收方视角</text>
  <line x1="340" y1="348" x2="1380" y2="348" stroke="#bbbbbb" stroke-width="2"/>

  <text x="60" y="396" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">- 只维护 Mixer 一个源的状态 (一个 seq 空间、一个 ts 空间)</text>
  <text x="60" y="436" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">- 通过 CSRC 知道「当前混合了哪几个人」</text>

  <!-- UI display bar -->
  <rect x="240" y="476" width="960" height="52" fill="#bbbbbb" rx="8"/>
  <text x="720" y="512" font-size="22" font-weight="bold" fill="#0d6b2e" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">UI 显示: Alice  ·  Bob  ·  Carol (正在说话)</text>
</svg>
