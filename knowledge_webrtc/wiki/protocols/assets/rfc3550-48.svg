<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="640" fill="#ffffff" rx="16"/>

  <!-- Top-tier: RTP Data Layer -->
  <rect x="40" y="40" width="1360" height="260" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <rect x="40" y="40" width="1360" height="60" fill="#bbbbbb" rx="12"/>
  <rect x="40" y="72" width="1360" height="28" fill="#bbbbbb"/>
  <text x="720" y="80" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">RTP 数据层面</text>

  <!-- RTP layer content -->
  <text x="100" y="144" text-anchor="start" font-size="26" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">Alice 发音频</text>
  <text x="360" y="144" text-anchor="start" font-size="24" fill="#1a3f8a" font-family="monospace">SSRC=0x7F3A</text>
  <text x="620" y="144" text-anchor="start" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">(随时可能变)</text>

  <text x="100" y="200" text-anchor="start" font-size="26" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">Alice 发视频</text>
  <text x="360" y="200" text-anchor="start" font-size="24" fill="#1a3f8a" font-family="monospace">SSRC=0xB821</text>
  <text x="620" y="200" text-anchor="start" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">(另一个 SSRC)</text>

  <!-- Divider note -->
  <rect x="360" y="240" width="720" height="48" rx="24" fill="#991b1b" opacity="0.15"/>
  <text x="720" y="274" text-anchor="middle" font-size="22" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">两个 SSRC 之间看不出任何关系</text>

  <!-- Down arrow between layers -->
  <line x1="720" y1="304" x2="720" y2="344" stroke="#1a3f8a" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Bottom-tier: RTCP Control Layer -->
  <rect x="40" y="350" width="1360" height="260" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <rect x="40" y="350" width="1360" height="60" fill="#bbbbbb" rx="12"/>
  <rect x="40" y="382" width="1360" height="28" fill="#bbbbbb"/>
  <text x="720" y="390" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">RTCP 控制层面</text>

  <!-- RTCP layer content -->
  <text x="100" y="454" text-anchor="start" font-size="24" fill="#555555" font-family="system-ui, -apple-system, sans-serif">音频 RTCP:</text>
  <text x="280" y="454" text-anchor="start" font-size="24" fill="#1a1a1a" font-family="monospace">SDES { SSRC=0x7F3A, </text>
  <text x="680" y="454" text-anchor="start" font-size="24" fill="#0d6b2e" font-family="monospace" font-weight="bold">CNAME="alice@pc1"</text>
  <text x="1070" y="454" text-anchor="start" font-size="24" fill="#1a1a1a" font-family="monospace">}</text>

  <text x="100" y="510" text-anchor="start" font-size="24" fill="#555555" font-family="system-ui, -apple-system, sans-serif">视频 RTCP:</text>
  <text x="280" y="510" text-anchor="start" font-size="24" fill="#1a1a1a" font-family="monospace">SDES { SSRC=0xB821, </text>
  <text x="680" y="510" text-anchor="start" font-size="24" fill="#0d6b2e" font-family="monospace" font-weight="bold">CNAME="alice@pc1"</text>
  <text x="1070" y="510" text-anchor="start" font-size="24" fill="#1a1a1a" font-family="monospace">}</text>

  <!-- CNAME link indicator -->
  <text x="720" y="546" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">同一个 CNAME</text>
  <line x1="720" y1="556" x2="720" y2="580" stroke="#1a3f8a" stroke-width="6"/>
  <text x="720" y="600" text-anchor="middle" font-size="24" font-weight="bold" fill="#0d6b2e" font-family="system-ui, -apple-system, sans-serif">同一个 Alice！</text>
</svg>
