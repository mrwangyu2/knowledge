<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#1a3f8a"/>
    </marker>
  </defs>
  <rect width="1440" height="320" fill="#ffffff" rx="16"/>
  <!-- Title -->
  <text x="40" y="60" font-size="30" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">场景 C: 安全网关 (SRTP ↔ RTP 加密转换)</text>
  <!-- Left: Public SRTP -->
  <rect x="40" y="96" width="440" height="160" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="260" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">公网 (加密 SRTP)</text>
  <text x="260" y="188" text-anchor="middle" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">A — SRTP 加密包 →</text>
  <text x="260" y="228" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">外部网络</text>
  <!-- Security Gateway -->
  <rect x="520" y="96" width="400" height="160" fill="#f0f0f0" stroke="#1a3f8a" stroke-width="6" rx="12"/>
  <text x="720" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">安全网关 (Translator)</text>
  <text x="720" y="188" text-anchor="middle" font-size="22" fill="#1a3f8a" font-family="system-ui, -apple-system, sans-serif">解密 SRTP → 重新封装 RTP</text>
  <text x="720" y="228" text-anchor="middle" font-size="20" fill="#555555" font-family="system-ui, -apple-system, sans-serif">SSRC 不变</text>
  <!-- Right: Private RTP -->
  <rect x="960" y="96" width="440" height="160" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="6" rx="12"/>
  <text x="1180" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">内网 (明文 RTP)</text>
  <text x="1180" y="188" text-anchor="middle" font-size="22" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif">→ RTP 明文包 → B</text>
  <text x="1180" y="228" text-anchor="middle" font-size="22" fill="#555555" font-family="system-ui, -apple-system, sans-serif">内部网络</text>
</svg>
